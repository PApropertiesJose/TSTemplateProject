<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1f" />
    <title>Admin</title>
    <script>
      // Paints the stored color scheme before first render so dark mode does not
      // flash white on reload. Key must match Mantine's localStorage manager.
      (function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value')
          var scheme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme)
        } catch (e) {
          // Storage can be unavailable (private mode); Mantine settles it at runtime.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
